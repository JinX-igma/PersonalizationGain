name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync
        run: uv venv .venv && uv pip install -e ".[dev]"

      - name: Lint
        run: uv run --active ruff check src analysis paper experiments tests

      - name: Unit tests + claim regeneration (tests/test_claims.py)
        run: make test

      - name: make figures (Stage 2 smoke test, no dataset needed)
        run: make figures

      - name: Upload regenerated figure
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
