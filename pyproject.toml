[project]
name = "repgain"
version = "0.1.0"
description = "Episode-repeatability diagnostics for personalization gains in wearable activity recognition, and the reproduction package for 'How Precise Is a Personalization Gain?'"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jingcheng Xu" }]
dependencies = [
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repgain"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# experiments/ are faithful, minimally-adapted ports of the original research
# scripts (terse, semicolon-joined statements, data-then-import ordering);
# rewriting their style risks introducing bugs in correctness-critical fits.
"experiments/*.py" = ["E501", "E702", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
